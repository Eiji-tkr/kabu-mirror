<style>
#updBtn,#logBtn,#watBtn,#addForm,#addBtn,#dEdit,#dAdd,[data-rm],#updState,#reqState{display:none!important}
.mbar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:12px;padding:6px max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px));background:#fff4d6;color:#5a4300;border-bottom:1px solid #ecd9a0}
.mbar a,.mbar button{color:inherit;font:inherit;text-decoration:underline;background:none;border:0;padding:0;cursor:pointer}
.mlock{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#f5f3ee;color:#1d1b16;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.mlock form{width:min(340px,100%);display:grid;gap:12px}
.mlock h1{font-size:18px;margin:0}
.mlock p{margin:0;font-size:13px;color:#5f5a50}
.mlock input[type=password]{font:inherit;font-size:16px;padding:10px 12px;border:1px solid #c9c3b6;border-radius:8px;background:#fff;color:inherit}
.mlock button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:#2f5d50;color:#fff}
.mlock label{display:flex;gap:6px;align-items:center;font-size:13px}
.mlock .err{color:#b3261e;min-height:1.2em}
@media (prefers-color-scheme:dark){
 .mbar{background:#3a3016;color:#f1dfa8;border-color:#5a4a1f}
 .mlock{background:#16150f;color:#ece8de}.mlock p{color:#a9a395}
 .mlock input[type=password]{background:#24221b;border-color:#4a463b}
 .mlock button{background:#4f8d7b}.mlock .err{color:#ff8a80}
}
</style>
<div class="mlock" id="mLock">
  <form id="mForm" autocomplete="on">
    <h1>株のページ（ミラー）</h1>
    <p>見るだけのページです。パスワードを入れてください。</p>
    <input type="text" name="username" value="kabu-mirror" autocomplete="username" hidden>
    <input type="password" id="mPw" autocomplete="current-password" aria-label="パスワード" required>
    <label><input type="checkbox" id="mKeep" checked>この端末で覚えておく</label>
    <button type="submit" id="mGo">開く</button>
    <div class="err" id="mErr" role="alert"></div>
  </form>
</div>
<script>
(function(){
  let ok; const ready = new Promise(r => ok = r);
  const no = () => Promise.reject({code: "read_only", message: "ミラーは見るだけです（変更は claude.ai のページで）"});
  function mkdb(D){
    const snap = v => ({data: () => v, exists: v != null});
    const doc = p => ({onSnapshot(cb){cb(snap(D.docs[p])); return () => {}}, get: async () => snap(D.docs[p]), set: no, update: no, delete: no});
    const coll = n => { const q = {
      onSnapshot(cb){cb({docs: (D.cols[n] || []).map(x => ({id: x.id, data: () => x.data}))}); return () => {}},
      get: async () => ({docs: (D.cols[n] || []).map(x => ({id: x.id, data: () => x.data}))}),
      orderBy(){return q}, limit(){return q}, where(){return q}, doc: id => doc(n + "/" + id), add: no}; return q };
    return {doc, collection: coll};
  }
  window.claude = {use: async n => n === "db" ? mkdb(await ready) : null};

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function open(pw){
    const r = await fetch("data.enc.json?t=" + Date.now(), {cache: "no-store"});
    if (!r.ok) throw new Error("データを読めませんでした（" + r.status + "）");
    const E = await r.json();
    const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(E.salt), iterations: E.iter, hash: "SHA-256"}, km, {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    let pt;
    try { pt = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(E.iv)}, key, b64(E.ct)) }
    catch { const e = new Error("パスワードが違います"); e.pw = true; throw e }
    const txt = await new Response(new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(txt);
  }
  function bar(D){
    const at = new Date(D.builtAt);
    const p = n => String(n).padStart(2, "0");
    const el = document.createElement("div"); el.className = "mbar";
    el.innerHTML = `<span><b>ミラー（見るだけ）</b>　データ作成 ${at.getMonth()+1}/${at.getDate()} ${p(at.getHours())}:${p(at.getMinutes())}</span>
      <button type="button" id="mReload">最新を読み込む</button>
      <a href="https://claude.ai/artifact/SJ2oTaF6XY2LDY9KDdmu6m" target="_blank" rel="noopener">claude.ai のページ</a>
      <button type="button" id="mOut">パスワードを忘れさせる</button>`;
    document.body.prepend(el);
    el.querySelector("#mReload").onclick = () => location.reload();
    el.querySelector("#mOut").onclick = () => { try{localStorage.removeItem("mpw")}catch{} location.reload() };
  }
  async function go(pw, keep){
    const err = document.getElementById("mErr"), btn = document.getElementById("mGo");
    btn.disabled = true; err.textContent = "開いています…";
    try {
      const D = await open(pw);
      try { keep ? localStorage.setItem("mpw", pw) : localStorage.removeItem("mpw") } catch {}
      document.getElementById("mLock").hidden = true; bar(D); ok(D);
    } catch (e) {
      err.textContent = e.message || "開けませんでした";
      if (e.pw) try { localStorage.removeItem("mpw") } catch {}
    } finally { btn.disabled = false }
  }
  document.getElementById("mForm").addEventListener("submit", e => { e.preventDefault(); go(document.getElementById("mPw").value, document.getElementById("mKeep").checked) });
  let saved = null; try { saved = localStorage.getItem("mpw") } catch {}
  if (saved) go(saved, true); else setTimeout(() => document.getElementById("mPw").focus(), 50);
})();
</script>
<script>

const GROUPS=[{key:"g:nisa",name:"NISA 小計",has:s=>NISA_SYS.includes(s)},{key:"g:toku",name:"特定 小計",has:s=>!NISA_SYS.includes(s)}];
const inF=p=>{if(!filter)return true;const g=GROUPS.find(g=>g.key===filter);return g?g.has(p.sys):p.sys===filter};
const fName=()=>{const g=GROUPS.find(g=>g.key===filter);return g?g.name.replace(" 小計",""):filter};
const SHORT=new Set(["BNF式","押し目"]);
let db=null, pos=[], prices={}, asOf="", filter=null, charts={}, info={}, infoAt="";

// 米国株：コードは英字のティッカー（例 NVDA、BRK.B）。株価・取得単価はドル、損益は今のドル円で円にする
const isUS=c=>!/^[0-9]{3}[0-9A-Z]$/.test(String(c||""));
const FX=()=>prices.USDJPY?.price;
const unit=c=>isUS(c)?"ドル":"円";
const fxOf=c=>isUS(c)?(FX()||NaN):1;
const plSold=p=>(+p.sellPrice-+p.cost)*+p.shares*fxOf(p.code);
const md=d=>d?`${+d.slice(5,7)}/${+d.slice(8,10)}`:"";
function daysTo(d){return Math.round((Date.parse(d)-Date.parse(today()))/864e5)}
function badges(code){
  const I=info[code]; if(!I)return "";
  let h="";
  if(I.next){const n=daysTo(I.next.date); if(n>=0&&n<=14)h+=`<span class="tag ev">決算 ${n===0?"今日":md(I.next.date)}</span>`}
  const L=I.latest; if(L&&L.label&&daysTo(L.date)>=-21){h+=`<span class="tag ${L.score>0?"g-good":L.score<0?"g-bad":""}">決算${esc(L.label)}</span>`}
  return h;
}
const oku=v=>{if(v==null)return "—";const a=Math.abs(v);return (v<0?"−":"")+(a>=1e12?(a/1e12).toFixed(2)+"兆":a>=1e8?(a/1e8).toLocaleString("ja-JP",{maximumFractionDigits:a>=1e10?0:1})+"億":(a/1e6).toLocaleString("ja-JP",{maximumFractionDigits:0})+"百万")+"円"};
const $=s=>document.querySelector(s);
const yen=(v,sign)=>{if(v==null||!isFinite(v))return "—";const r=Math.round(v);return (sign&&r>0?"+":"")+r.toLocaleString("ja-JP")+"円"};
const pct=v=>(v==null||!isFinite(v))?"—":(v>0?"+":"")+(v*100).toFixed(2)+"%";
const cls=v=>v>0?"up":v<0?"down":"";
const px=v=>v==null?"—":Number(v).toLocaleString("ja-JP",{maximumFractionDigits:1});
function esc(s){const d=document.createElement("div");d.textContent=s??"";return d.innerHTML}
function toast(t){const e=$("#toast");e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,2200)}

function calc(p){
  const q=prices[p.code]; const sh=+p.shares||0, cost=+p.cost||0, f=fxOf(p.code);
  const o={price:q?.price,prev:q?.prev,at:q?.at,ok:!!q&&sh>0&&cost>0&&isFinite(f),f};
  if(o.ok){o.val=q.price*sh*f;o.cb=cost*sh*f;o.pl=o.val-o.cb;o.pct=q.price/cost-1;o.day=(q.price-q.prev)*sh*f;o.dayPct=q.price/q.prev-1}
  return o;
}
function sum(list){
  let val=0,cb=0,day=0,prevVal=0,miss=0;
  for(const p of list){const c=calc(p);if(!c.ok){miss++;continue}val+=c.val;cb+=c.cb;day+=c.day;prevVal+=c.prev*(+p.shares)*c.f}
  return {val,cb,pl:val-cb,pct:cb?val/cb-1:null,day,dayPct:prevVal?day/prevVal:null,miss,n:list.length};
}

function sellLine(p){const S=(prices[p.code]||{}).sell;if(!S||S.sys!==p.sys)return "";
  return `<div class="sellp${S.state==="sell"?" now":""}">${S.state==="sell"?"🔴 ":"🔺 "}${esc(S.when)}<br>⏱ ${esc(S.limitText)}${S.signalGuess?"（合図の日は目安）":""}</div>`}
function sellDet(p){const S=(prices[p.code]||{}).sell;if(!S||S.sys!==p.sys)return "";
  return `<section class="dsec"><b>売る予定（${esc(S.sys)}）</b><div class="small">${S.state==="sell"?"🔴 ":"🔺 "}${esc(S.when)}</div><div class="small">⏱ ${esc(S.limitText)}</div><div class="small">決まり：${esc(S.rule)}（判定は終値、売りは翌朝の寄り成行）</div><div class="small">売りの値段：終値が${Number(S.px).toLocaleString()}円以上${S.gain_at_px!=null?`（取得値から${S.gain_at_px>=0?"+":""}${S.gain_at_px}%）`:""}　合図の日：${esc(S.signal)}${S.signalGuess?"（目安）":""}</div><div class="small mute">価格は ${esc(S.lastDate)} の終値（場中は今の値段）で計算</div></section>`}
function render(){
  const hold=pos.filter(p=>p.status!=="sold"), sold=pos.filter(p=>p.status==="sold");
  const t=sum(hold);
  $("#tPL").textContent=yen(t.pl,1); $("#tPL").className="big n "+cls(t.pl);
  $("#tPct").innerHTML=`<span class="${cls(t.pct)}">${pct(t.pct)}</span>`;
  $("#tDay").innerHTML=`本日 <span class="${cls(t.day)}">${yen(t.day,1)}（${pct(t.dayPct)}）</span>`;
  $("#tVal").textContent=`評価額 ${yen(t.val)}`;
  const tp=prices["1306"];
  const at=Object.values(prices).map(x=>x.at).filter(Boolean).sort().pop()||"";
  const stale=at && !at.startsWith(new Date(Date.now()+9*3600e3).toISOString().slice(0,10));
  const jn=new Date(Date.now()+9*3600e3), jm=jn.getUTCHours()*60+jn.getUTCMinutes(), wd=jn.getUTCDay();
  const early=stale&&wd>=1&&wd<=5&&jm>=540&&jm<580;
  $("#stamp").innerHTML=asOf?`<span class="${stale?"stale":""}">株価 ${esc(at)}時点（約20分遅れ）${early?"・今日の株価は9時20分ごろから入ります":""}</span>`+
    (tp?`<span>TOPIX(1306) 本日 <span class="${cls(tp.price-tp.prev)}">${pct(tp.price/tp.prev-1)}</span></span>`:"")+
    (FX()?`<span>ドル円 ${px(FX())}円</span>`:"")+(t.miss?`<span class="stale">株数・取得単価なし ${t.miss}件（合計に含めず）</span>`:""):"株価はまだありません。「株価を更新」を押してください。";

  // システム別
  const L=$("#ledger"); L.innerHTML="";
  const realOf=list=>list.length?list.reduce((a,p)=>a+(plSold(p)||0),0):null;
  const order=[...SYS,...new Set(pos.map(p=>p.sys).filter(x=>x&&!SYS.includes(x)))];
  for(const g of GROUPS){
    const gh=hold.filter(p=>g.has(p.sys)), gs=sold.filter(p=>g.has(p.sys));
    L.append(row(g.name,sum(gh),gh.length,g.key,realOf(gs),"grp"));
    for(const s of order.filter(g.has)){const h=hold.filter(p=>p.sys===s);const so=sold.filter(p=>p.sys===s);if(!h.length&&!so.length&&s!=="その他")continue;
      L.append(row(s,sum(h),h.length,s,realOf(so),"sub"))}
  }
  L.append(row("合計",t,hold.length,null,realOf(sold),"tot"));
  function row(name,st,n,key,real,kind){
    const b=document.createElement("button");b.type="button";b.className="sysrow "+(kind||"");b.setAttribute("aria-pressed",String(filter===key));
    b.innerHTML=`<div><div class="nm">${esc(name)}</div><div class="sub">${n}銘柄${st.miss?`・未入力${st.miss}`:""}${real!=null?`・確定 <span class="n ${cls(real)}">${yen(real,1)}</span>`:""}</div></div>
      <div class="r n"><div class="pl ${cls(st.pl)}">${yen(st.pl,1)}</div><div class="sub"><span class="${cls(st.pct)}">${pct(st.pct)}</span>・本日 <span class="${cls(st.day)}">${yen(st.day,1)}</span></div></div>`;
    b.onclick=()=>{filter=key;render()};return b}

  // 銘柄
  $("#listTitle").textContent=filter?`${fName()}の保有`:"すべての保有";
  let items=hold.filter(inF).map(p=>({p,c:calc(p)}));
  const k=$("#sort").value;
  const v=(x,f)=>x.c.ok?x.c[f]:Infinity;
  items.sort(k==="code"?(a,b)=>String(a.p.code).localeCompare(String(b.p.code)):k==="pctd"?(a,b)=>(b.c.ok?b.c.pct:-Infinity)-(a.c.ok?a.c.pct:-Infinity):k==="day"?(a,b)=>v(a,"day")-v(b,"day"):(a,b)=>v(a,"pct")-v(b,"pct"));
  const box=$("#list");
  if(!items.length){box.innerHTML=`<div class="empty">${filter?esc(fName())+"の保有はありません。":"保有銘柄がありません。"}右下の「＋ 追加」から登録できます。</div>`}
  else{box.innerHTML=`<div class="head"><span>銘柄・株数</span><span>現在値<br>取得単価</span><span>評価損益<br>本日</span></div>`;
    for(const {p,c} of items){const b=document.createElement("button");b.type="button";b.className="item";
      b.innerHTML=`<div style="min-width:0"><div class="nm">${esc(p.name||p.code)}</div><div class="cd">${esc(p.code)}・${+p.shares?(+p.shares).toLocaleString()+"株":'<span class="tag warn">株数なし</span>'}${filter===p.sys?"":`<span class="tag">${esc(p.sys)}</span>`}${p.account==="NISA"?'<span class="tag">NISA</span>':""}${badges(p.code)}</div></div>
        <div class="r n"><div class="${c.price!=null&&c.prev!=null?cls(c.price-c.prev):""}">${px(c.price)}</div><div class="s mute">${+p.cost?px(p.cost):"単価なし"}</div></div>
        <div class="r n">${c.ok?`<div class="${cls(c.pl)}">${yen(c.pl,1)}</div><div class="s"><span class="${cls(c.pct)}">${pct(c.pct)}</span><br><span class="${cls(c.day)}">${yen(c.day,1)}</span></div>`:`<div class="mute s">${c.price==null?"株価なし":"入力待ち"}</div>`}</div>${sellLine(p)}`;
      b.onclick=()=>openDetail(p);box.append(b)}}

  // 売却済み
  const sl=sold.filter(inF).sort((a,b)=>String(b.sellDate||"").localeCompare(String(a.sellDate||"")));
  const rs=sl.reduce((a,p)=>a+(plSold(p)||0),0);
  $("#soldSum").innerHTML=sl.length?`<span class="${cls(rs)}">${yen(rs,1)}</span>`:"";
  $("#sold").innerHTML=sl.length?`<div class="head"><span>銘柄・売却日</span><span>売値<br>取得単価</span><span>確定損益<br>損益率</span></div>`:`<div class="empty">売却済みはありません。</div>`;
  for(const p of sl){const pl=plSold(p), r=+p.sellPrice/+p.cost-1;const b=document.createElement("button");b.type="button";b.className="item";
    b.innerHTML=`<div style="min-width:0"><div class="nm">${esc(p.name||p.code)}</div><div class="cd">${esc(p.sellDate||"")}・${(+p.shares).toLocaleString()}株<span class="tag">${esc(p.sys)}</span></div></div>
      <div class="r n"><div>${px(p.sellPrice)}</div><div class="s mute">${px(p.cost)}</div></div>
      <div class="r n"><div class="${cls(pl)}">${yen(pl,1)}</div><div class="s ${cls(r)}">${pct(r)}</div></div>`;
    b.onclick=()=>openSheet(p);$("#sold").append(b)}
}
$("#sort").onchange=render;

const today=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
function drawChart(box,pts,cost,key){
  if(!pts||pts.length<2){box.innerHTML='<div class="small">チャートのデータがありません。「株価を更新」で入ります。</div>';return}
  const W=340,H=210,L=4,R=46,T=48,B=22;
  const ys=pts.map(x=>x[1]); let lo=Math.min(...ys), hi=Math.max(...ys);
  const showCost=cost>0&&cost>=lo-(hi-lo)*.6&&cost<=hi+(hi-lo)*.6;
  if(showCost){lo=Math.min(lo,cost);hi=Math.max(hi,cost)}
  const pad=(hi-lo)*.08||hi*.01; lo-=pad; hi+=pad;
  const X=i=>L+(W-L-R)*i/(pts.length-1), Y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p[1]).toFixed(1)}`).join("");
  const area=line+`L${X(pts.length-1).toFixed(1)},${H-B}L${X(0).toFixed(1)},${H-B}Z`;
  const ticks=[0,.5,1].map(f=>lo+pad+(hi-lo-2*pad)*f);
  const first=pts[0][1], last=pts.at(-1)[1], up=last>=first;
  const lab=[0,Math.floor((pts.length-1)/2),pts.length-1];
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="終値の推移">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${W-R+6}" y="${Y(v)+4}" font-size="10" fill="var(--mute)" font-family="var(--num)">${px(v)}</text>`).join("")}
    ${showCost?`<line x1="${L}" x2="${W-R}" y1="${Y(cost)}" y2="${Y(cost)}" stroke="var(--mute)" stroke-dasharray="4 3" stroke-width="1"/><text x="${L+2}" y="${Y(cost)-4}" font-size="10" fill="var(--mute)">取得単価 ${px(cost)}</text>`:""}
    <path d="${area}" fill="${up?"var(--up)":"var(--down)"}" opacity=".08"/>
    <path d="${line}" fill="none" stroke="${up?"var(--up)":"var(--down)"}" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last)}" r="3.5" fill="${up?"var(--up)":"var(--down)"}"/>
    ${lab.map((i,k)=>`<text x="${X(i)}" y="${H-6}" font-size="10" fill="var(--mute)" text-anchor="${k===0?"start":k===2?"end":"middle"}">${esc(pts[i][0])}</text>`).join("")}
    <line class="cross" x1="0" x2="0" y1="${T}" y2="${H-B}" stroke="var(--fg)" stroke-width="1" opacity="0"/>
    <circle class="dot" r="4" fill="var(--panel)" stroke="var(--fg)" stroke-width="2" opacity="0"/>
  </svg><div class="readout n"></div><input type="range" class="slider" min="0" max="${pts.length-1}" step="1" aria-label="見る時点を動かす">`;
  const svg=box.querySelector("svg"), cr=svg.querySelector(".cross"), dot=svg.querySelector(".dot"), ro=box.querySelector(".readout"), sl=box.querySelector(".slider");
  const set=i=>{i=Math.max(0,Math.min(pts.length-1,i|0)); if(key)selMap[key]=pts[i][0];
    cr.setAttribute("x1",X(i));cr.setAttribute("x2",X(i));cr.setAttribute("opacity",".35");
    dot.setAttribute("cx",X(i));dot.setAttribute("cy",Y(pts[i][1]));dot.setAttribute("opacity","1");
    const v=pts[i][1], a=v/first-1, c=cost>0?v/cost-1:null;
    ro.innerHTML=`<div><b>${esc(pts[i][0])}</b>　${px(v)}${unit(String(key||"").split(":")[0])}</div><div>はじめ比 <span class="${cls(a)}">${pct(a)}</span>${c!=null?`　取得比 <span class="${cls(c)}">${pct(c)}</span>`:""}</div>`;
    const bw=svg.getBoundingClientRect().width||W, rw=ro.offsetWidth||150, cx=X(i)/W*bw;
    ro.style.left=Math.min(Math.max(cx-rw/2,0),bw-rw)+"px";
    sl.value=i};
  const fromX=e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*W;
    set(Math.round((x-L)/(W-L-R)*(pts.length-1)))};
  svg.addEventListener("pointerdown",e=>{e.preventDefault();fromX(e)});
  svg.addEventListener("pointermove",e=>{if(e.pointerType==="mouse"||e.buttons)fromX(e)});
  sl.addEventListener("input",()=>set(+sl.value));
  const keep=key&&selMap[key]?pts.findIndex(x=>x[0]===selMap[key]):-1;
  set(keep>=0?keep:pts.length-1);
}
const selMap={};
function earnHTML(code){
  const I=info[code];
  if(!I)return `<div class="small">決算の情報はまだありません。「株価を更新」で入ります。</div>`;
  let h="";
  const N=I.next;
  h+=`<dl class="kv"><dt>次の決算</dt><dd>${N?`${esc(N.date.replaceAll("-","/"))}${N.time?" "+esc(N.time):""}${(()=>{const n=daysTo(N.date);return n===0?"（今日）":n>0?`（あと${n}日）`:""})()}`:"未発表（今期の分は発表済み）"}</dd></dl>`;
  const L=I.latest;
  if(L){
    const g=L.label?`<span class="grade ${L.score>0?"good":L.score<0?"bad":""}">${esc(L.label)}</span>`:"";
    h+=`<div class="dhead"><h4>直近の決算（${md(L.date)}）</h4>${g}</div><div class="small">${L.url?`<a href="${esc(L.url)}">${esc(L.title)}</a>`:esc(L.title)}</div>`;
    if(L.nodata){h+=`<div class="small">数値は取れませんでした（TDnetの公開期間が過ぎた資料です）。</div>`}
    else{
      const sy=L.sales&&L.sales.cur!=null&&L.sales.prior>0?L.sales.cur/L.sales.prior-1:null;
      h+=`<dl class="kv n">
        ${L.sales&&L.sales.cur!=null?`<dt>売上（累計）</dt><dd>${oku(L.sales.cur)}${sy!=null?` <span class="${cls(sy)}">${pct(sy).replace(/\.\d+%/,"%")}</span>`:""}</dd>`:""}
        ${L.metric?`<dt>${esc(L.metric)}（累計）</dt><dd>${oku(L.cur)}${L.yoy!=null?` <span class="${cls(L.yoy)}">${pct(L.yoy).replace(/\.\d+%/,"%")}</span>`:""}</dd>`:""}
        ${L.fc!=null?`<dt>${L.q===4?"今期の会社予想":"通期の会社予想"}</dt><dd>${oku(L.fc)}</dd>`:""}
        ${L.progress!=null?`<dt>進み具合</dt><dd>${(L.progress*100).toFixed(0)}%（目安 ${(L.std*100).toFixed(0)}%）</dd>`:""}
        ${L.react?`<dt>翌日の株価（${md(L.react.day)}）</dt><dd><span class="${cls(L.react.ret)}">${pct(L.react.ret)}</span>・TOPIX比 <span class="${cls(L.react.vs)}">${pct(L.react.vs)}</span></dd>`:""}
      </dl>`;
      if(L.why&&L.why.length)h+=`<ul class="why">${L.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul>`;
      h+=`<div class="small">評価は会社の数字だけで付けた目安です（前年同期比・会社予想に対する進み具合・業績予想の修正）。市場の予想とは比べていません。</div>`;
    }
  }
  if(I.revisions&&I.revisions.length){
    h+=`<h4 style="margin:4px 0 0">業績予想の修正</h4><div>`+I.revisions.map(r=>`<div class="rev">
      <div><b class="${r.dir==="上方"?"up":r.dir==="下方"?"down":""}">${esc(r.dir==="不明"?"修正":r.dir+"修正")}</b> ${md(r.date)}${r.span?"・"+esc(r.span):""}${r.metric&&r.prev!=null&&r.cur!=null?`・${esc(r.metric)} ${oku(r.prev)} → ${oku(r.cur)}${r.chg!=null?`（${pct(r.chg).replace(/\.\d+%/,"%")}）`:""}`:""}</div>
      <div class="small">${r.url?`<a href="${esc(r.url)}">${esc(r.title)}</a>`:esc(r.title)}${r.react?`・翌日 TOPIX比 <span class="${cls(r.react.vs)}">${pct(r.react.vs)}</span>`:""}</div></div>`).join("")+`</div>`;
  }
  if(I.notes&&I.notes.length)h+=`<h4 style="margin:4px 0 0">配当</h4>`+I.notes.map(n=>`<div class="small">${md(n.date)} ${n.url?`<a href="${esc(n.url)}">${esc(n.title)}</a>`:esc(n.title)}</div>`).join("");
  return h;
}

  const root=$("#sheetRoot"), c=calc(p), code=String(p.code);
  const held=!!p.id;
  root.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-label="${esc(p.name||code)}">
    <div style="min-width:0"><h3>${esc(p.name||code)}</h3><span class="small">${esc(code)}・${esc(p.sys)}${p.account==="NISA"?"・NISA":""}</span></div>

    <div class="dhead n"><span class="px">${px(c.price)}${unit(code)}</span>${c.prev!=null&&c.price!=null?`<span class="${cls(c.price-c.prev)}">本日 ${pct(c.price/c.prev-1)}</span>`:""}
      ${c.ok?`<span>損益 <span class="${cls(c.pl)}">${yen(c.pl,1)}（${pct(c.pct)}）</span></span>`:""}</div>
    ${c.price==null?'<div class="small">この銘柄の株価はまだありません。次の自動更新（昼・夕方）か「株価を更新」で入ります。</div>':""}
    <div class="dhead"><div class="seg" role="group" aria-label="期間"><button type="button" id="sp5" aria-pressed="${chartSpan==="d5"}">5日</button><button type="button" id="sp1" aria-pressed="${chartSpan==="m1"}">1か月</button></div><span class="small n" id="spChg"></span></div>
    <div class="chart" id="chartBox"></div>
    <div class="links">
      ${isUS(code)?`<a href="https://finance.yahoo.com/quote/${encodeURIComponent(code.replace(".","-"))}">Yahoo Finance（米国）</a>
      <a href="https://kabutan.jp/stock/?code=${encodeURIComponent(code)}">株探（米国株）</a>`:`<a href="https://finance.yahoo.co.jp/quote/${encodeURIComponent(code)}.T/chart">Yahoo!ファイナンスのチャート</a>
      <a href="https://kabutan.jp/stock/chart?code=${encodeURIComponent(code)}">株探のチャート</a>
      <a href="https://kabutan.jp/stock/finance?code=${encodeURIComponent(code)}">株探の決算</a>`}
    </div>
    ${held?sellDet(p):""}
    ${held?`<section class="dsec">${earnHTML(code)}</section>`:""}
    ${noticeLinks(code)}
    <div class="actions" style="border-top:1px solid var(--line);padding-top:12px"><button class="btn" type="button" id="dClose">閉じる</button>${held?'<button class="btn pri" type="button" id="dEdit">株数・売却を編集</button>':'<button class="btn pri" type="button" id="dAdd">保有に追加</button>'}</div>
  </div></div>`;
  const draw=()=>{const pts=(charts[code]||{})[chartSpan]||[];drawChart($("#chartBox"),pts,+p.cost,code+":"+chartSpan);
    $("#sp5").setAttribute("aria-pressed",chartSpan==="d5");$("#sp1").setAttribute("aria-pressed",chartSpan==="m1");
    $("#spChg").innerHTML=pts.length>1?`${chartSpan==="d5"?"5日":"1か月"}で <span class="${cls(pts.at(-1)[1]-pts[0][1])}">${pct(pts.at(-1)[1]/pts[0][1]-1)}</span>`:""};
  $("#sp5").onclick=()=>{chartSpan="d5";draw()}; $("#sp1").onclick=()=>{chartSpan="m1";draw()};
  draw();
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")root.innerHTML=""};
  $("#dClose").onclick=()=>root.innerHTML="";
  $("#dCloseTop").onclick=()=>root.innerHTML="";
  if(held)$("#dEdit").onclick=()=>openSheet(p);
  else $("#dAdd").onclick=()=>{root.innerHTML="";openSheet(null);setTimeout(()=>{$("#fCode").value=code;$("#fName").value=p.name&&p.name!==code?p.name:""},60)};
  root.querySelectorAll(".nlink").forEach(b=>b.onclick=()=>{root.innerHTML="";goNotice(b.dataset.nid)});
}
// ---- 通知タブ ----
function ntime(t){if(!t)return "";const d=new Date(t);const j=new Date(d.getTime()+9*3600e3).toISOString();return `${+j.slice(5,7)}/${+j.slice(8,10)} ${j.slice(11,16)}`}
function linkify(body){
  // 「名前（1234）」をタップできるようにする。名前は直前の記号・空白より後ろ
  return esc(body).replace(/([^\s　🟢🔴⚪🟡✖✅▶🤖🔺■【】・、：:"'<>&;]{1,24})?（([0-9]{3}[0-9A-Z])）/g,(m,nm,cd)=>`<button type="button" class="cl" data-c="${cd}" data-n="${nm||""}">${nm||""}（${cd}）</button>`);
}
function setTab(t){tab=t;try{localStorage.setItem("holdTab",t)}catch{}
  $("#tabPL").setAttribute("aria-selected",t==="pl");$("#tabN").setAttribute("aria-selected",t==="n");
  $("#viewPL").style.display=t==="pl"?"grid":"none";$("#viewN").style.display=t==="n"?"grid":"none";$("#addBtn").style.display=t==="pl"?"":"none";
  syncNClose();if(t==="n")renderNotices()}
$("#tabPL").onclick=()=>setTab("pl");$("#tabN").onclick=()=>setTab("n");
function goNotice(id){nFilter="すべて";nHL=id;nOpen[id]=true;setTab("n");
  requestAnimationFrame(()=>{const e=document.getElementById("n-"+id);if(e)e.scrollIntoView({block:"start",behavior:"smooth"})})}
const WHAT={morning:"朝の自動更新",noon:"昼の自動更新",evening:"夕方の自動更新",button:"「株価を更新」ボタン"};
function renderUpd(){
  const e=$("#upStamp"); if(!upd.updatedAt){e.textContent="";return}
  const old=Date.now()-Date.parse(upd.updatedAt)>20*3600e3;
  e.innerHTML=`<span class="${old?"stale":""}">最終更新 ${esc(ntime(upd.updatedAt))}（${esc(WHAT[upd.what]||upd.what||"")}）</span>`+(upd.error?`<span class="stale">失敗：${esc(upd.error)}</span>`:"");
}
function syncNClose(){const any=tab==="n"&&Object.values(nOpen).some(Boolean);$("#nClose").hidden=!any}
$("#nClose").onclick=()=>{nOpen={};renderNotices();window.scrollTo({top:0,behavior:"smooth"})};
function renderNotices(){
  const today0=today();
  const cnt=notices.filter(n=>n.t&&new Date(new Date(n.t).getTime()+9*3600e3).toISOString().slice(0,10)===today0).length;
  $("#nCnt").textContent=cnt?`今日${cnt}`:"";
  syncNClose();
  if(tab!=="n")return;
  $("#nStamp").innerHTML=nAsOf?`各システムの判定（直近5日分）　📱＝スマホにも通知したもの`:"まだ判定がありません。次の自動更新（朝・昼・夕方）で入ります。";
  const last={};for(const n of notices){if(!last[n.sys])last[n.sys]=n.t}
  $("#nLast").innerHTML=Object.keys(last).length?"最後の判定："+NSYS.slice(1).filter(s=>last[s]).map(s=>`${esc(s)} ${esc(ntime(last[s]))}`).join("・"):"";
  const C=$("#nChips");C.innerHTML="";
  for(const s of NSYS){const n=s==="すべて"?notices.length:notices.filter(x=>x.sys===s).length;
    const b=document.createElement("button");b.type="button";b.textContent=`${s} ${n}`;b.setAttribute("aria-pressed",nFilter===s);
    b.onclick=()=>{nFilter=s;nHL="";renderNotices()};C.append(b)}
  const L=notices.filter(n=>nFilter==="すべて"||n.sys===nFilter);
  const box=$("#nList");
  if(!L.length){box.innerHTML='<div class="empty" style="background:var(--panel);border:1px solid var(--line);border-radius:10px">この条件の判定はありません。</div>';return}
  box.innerHTML=L.map(n=>{const open=!!nOpen[n.id];const long=(n.body||"").split("\n").length>6;
    return `<article class="ncard${nHL===n.id?" hl":""}" id="n-${esc(n.id)}">
      ${long&&open?`<button type="button" class="ntop" data-id="${esc(n.id)}">閉じる</button>`:""}
      <div class="nmeta"><span class="n">${esc(ntime(n.t))}</span><span class="tag">${esc(n.sys)}</span>${n.pushed?'<span title="スマホにも通知した">📱</span>':""}</div>
      <div class="ntitle">${linkify(n.title||"")}</div>
      <pre class="nbody${long&&!open?" clip":""}">${linkify(n.body||"")}</pre>
      ${long?`<button type="button" class="nmore" data-id="${esc(n.id)}">${open?"たたむ":"全文を見る"}</button>`:""}
    </article>`}).join("");
  box.querySelectorAll(".nmore").forEach(b=>b.onclick=()=>{nOpen[b.dataset.id]=!nOpen[b.dataset.id];renderNotices()});
  box.querySelectorAll(".ntop").forEach(b=>b.onclick=()=>{nOpen[b.dataset.id]=false;renderNotices();const e=document.getElementById("n-"+b.dataset.id);if(e)e.scrollIntoView({block:"nearest"})});
  box.querySelectorAll(".cl").forEach(b=>b.onclick=()=>openCode(b.dataset.c,b.dataset.n));
}
function openSheet(p){
  const isNew=!p; p=p||{sys:filter||"押し目",account:"特定",buyDate:today(),status:"hold"};
  const sold=p.status==="sold"; const cur=prices[p.code]?.price;
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="f" novalidate>
    <h3>${isNew?"銘柄を追加":esc(p.name||p.code)+(sold?"（売却済み）":"")}</h3>
    <div class="grid2">
      <label>コード<input id="fCode" class="n" value="${esc(p.code||"")}" inputmode="text" autocomplete="off" required></label>
      <label>銘柄名<input id="fName" value="${esc(p.name||"")}" autocomplete="off"></label>
      <label>システム<select id="fSys">${SYS.map(s=>`<option${s===p.sys?" selected":""}>${s}</option>`).join("")}</select></label>
      <label>口座<select id="fAcc">${["特定","NISA"].map(s=>`<option${s===p.account?" selected":""}>${s}</option>`).join("")}</select></label>
      <label>株数<input id="fSh" class="n" type="number" inputmode="numeric" min="0" step="1" value="${p.shares??""}"></label>
      <label>取得単価（円・米国株はドル）<input id="fCost" class="n" type="number" inputmode="decimal" min="0" step="0.1" value="${p.cost??""}"></label>
      <label>買った日<input id="fDate" type="date" value="${esc(p.buyDate||"")}"></label>
      <label>メモ<input id="fNote" value="${esc(p.note||"")}" autocomplete="off"></label>
    </div>
    ${isNew?"":`<div class="sellbox"><div class="grid2">
      <label>売値（円・米国株はドル）<input id="fSell" class="n" type="number" inputmode="decimal" min="0" step="0.1" value="${p.sellPrice??(cur??"")}"></label>
      <label>売った日<input id="fSellDate" type="date" value="${esc(p.sellDate||today())}"></label></div>
      <div class="actions">${sold?`<button class="btn" type="button" id="unsell">保有中に戻す</button>`:""}<button class="btn" type="button" id="sell">${sold?"売却内容を保存":"売却を記録"}</button></div></div>`}
    <div class="msg" id="msg"></div>
    <div class="actions">
      ${isNew?"":`<button class="btn dng" type="button" id="del">削除</button>`}
      <button class="btn" type="button" id="cancel">閉じる</button>
      <button class="btn pri" type="submit">保存</button>
    </div></form></div>`;
  const close=()=>root.innerHTML="";
  $("#scrim").onclick=e=>{if(e.target.id==="scrim")close()};
  $("#cancel").onclick=close;
  const read=()=>({code:$("#fCode").value.trim().toUpperCase(),name:$("#fName").value.trim(),sys:$("#fSys").value,account:$("#fAcc").value,
    shares:$("#fSh").value===""?0:+$("#fSh").value,cost:$("#fCost").value===""?0:+$("#fCost").value,buyDate:$("#fDate").value,note:$("#fNote").value.trim()});
  const save=async(extra={})=>{
    const d={...read(),...extra};
    if(!/^[0-9]{3}[0-9A-Z]$/.test(d.code)&&!/^[A-Z]{1,5}([.-][A-Z]{1,2})?$/.test(d.code)){$("#msg").textContent="コードは日本株なら4文字（例：7203、285A）、米国株ならティッカー（例：NVDA、BRK.B）で入れてください。";return}
    if(!db){$("#msg").textContent="保存先に接続できていません。ページを開き直してください。";return}
    try{ if(isNew){await db.collection("positions").add({...d,status:"hold",createdAt:new Date().toISOString()})}
      else{await db.collection("positions").doc(p.id).update({...d,updatedAt:new Date().toISOString()})}
      close();toast(isNew?"追加しました":"保存しました");
      if(!prices[d.code])setTimeout(()=>toast("この銘柄の株価は次の「更新」で入ります"),2300);
    }catch(e){$("#msg").textContent="保存できませんでした："+(e?.message||e?.code||"")}
  };
  $("#f").onsubmit=e=>{e.preventDefault();save()};
  if(!isNew){
    $("#sell").onclick=()=>{const v=+$("#fSell").value;if(!(v>0)){$("#msg").textContent="売値を入れてください。";return}
      if(!(+$("#fSh").value>0&&+$("#fCost").value>0)){$("#msg").textContent="売却を記録するには株数と取得単価が必要です。";return}
      save({status:"sold",sellPrice:v,sellDate:$("#fSellDate").value||today()})};
    if(sold)$("#unsell").onclick=()=>save({status:"hold",sellPrice:null,sellDate:null});
    let armed=false;
    $("#del").onclick=async()=>{if(!armed){armed=true;$("#del").textContent="もう一度押すと削除";return}
      try{await db.collection("positions").doc(p.id).delete();close();toast("削除しました")}catch(e){$("#msg").textContent="削除できませんでした："+(e?.message||"")}};
  }
  setTimeout(()=>(isNew?$("#fCode"):$("#fSh")).focus(),50);
}
$("#addBtn").onclick=()=>openSheet(null);

let req={};
const TRIG="trig_01WR7vZNMB2Y8R1tAhzUAKhp";
function renderReq(){
  const st=$("#updState"), b=$("#updBtn");
  const running=req.status==="running" && Date.now()-Date.parse(req.requestedAt||0)<10*60e3;
  b.disabled=running;
  if(running){const m=Math.max(0,Math.round((Date.now()-Date.parse(req.requestedAt))/60e3));st.innerHTML=`<span class="spin" aria-hidden="true"></span>更新中（${m}分経過・ふだん3〜5分）`}
  else if(req.status==="error")st.innerHTML=`<span class="stale">前回の更新は失敗しました：${esc(req.error||"")}</span>`;
  else if(req.status==="running")st.innerHTML=`<span class="stale">前回の更新が10分以上終わっていません。もう一度押してください。</span>`;
  else st.textContent="";
}
setInterval(renderReq,30e3);
$("#updBtn").onclick=async()=>{
  const b=$("#updBtn"); b.disabled=true; $("#updState").textContent="起動しています…";
  try{
    const mcp=await window.claude?.use?.("mcp");
    if(!mcp)throw {code:"unavailable"};
    await mcp.callTool("Claude Code Remote","fire_trigger",{trigger_id:TRIG},{cache:false});
    const now=new Date().toISOString();
    try{await db.doc("meta/request").set({status:"running",requestedAt:now})}catch{}
    req={status:"running",requestedAt:now};renderReq();
  }catch(e){b.disabled=false;
    const c=e?.code||"";
    $("#updState").innerHTML=`<span class="stale">${c==="not_granted"||c==="consent_required"?"接続が許可されませんでした。もう一度押して「許可」を選んでください。":c==="server_not_connected"||c==="server_not_found"?"Claude Code Remote の接続が必要です。":"起動できませんでした（"+esc(c||e?.message||"不明")+"）。チャットで「更新」と送っても更新できます。"}</span>`}
};

render();
try{const t=localStorage.getItem("holdTab");if(t==="n")setTab("n")}catch{}
(async()=>{
  const timer=setTimeout(()=>{if(!pos.length)$("#list").innerHTML='<div class="empty">保存先の応答がありません。ページを開き直してください。</div>'},10000);
  db=await window.claude?.use?.("db").catch(()=>null);
  if(!db){clearTimeout(timer);$("#list").innerHTML='<div class="empty">保存先に接続できません。claude.aiにログインした状態で開いてください。</div>';return}
  db.collection("positions").onSnapshot(s=>{clearTimeout(timer);pos=s.docs.map(d=>({id:d.id,...d.data()}));render()},
    e=>{$("#list").innerHTML=`<div class="empty">読み込めませんでした（${esc(e.code)}）。</div>`});
  db.doc("meta/request").onSnapshot(s=>{req=s.data()||{};renderReq()});
  db.doc("meta/charts").onSnapshot(s=>{charts=(s.data()||{}).charts||{}});
  db.doc("meta/info").onSnapshot(s=>{const d=s.data()||{};info=d.info||{};infoAt=d.asOf||"";render()});
  db.doc("meta/prices").onSnapshot(s=>{const d=s.data()||{};prices=d.prices||{};asOf=d.asOf||"";render()});
  db.doc("meta/status").onSnapshot(s=>{upd=s.data()||{};renderUpd()},()=>{});
  db.doc("meta/notices").onSnapshot(s=>{const d=s.data()||{};notices=d.items||[];nAsOf=d.asOf||"";renderNotices()},()=>{});
})();
</script>

</body></html>
